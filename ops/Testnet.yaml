# Maintains a node 0 as a bootnode service
apiVersion: v1
kind: Namespace
metadata:
  name: testnet
---
apiVersion: v1
kind: Service
metadata:
  name: bootnode
  namespace: testnet
spec:
  selector:
    app: bootnode
  ports:
    - name: p2p
      port: 8575
      targetPort: 8575
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-0
  namespace: testnet
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bootnode
  template:
    metadata:
      labels:
        app: bootnode
    spec:
      containers:
        - name: node
          image: p2p-node:latest
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/node
            - --self
            - $(POD_IP)
            - --boot
            - $(POD_IP)
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi