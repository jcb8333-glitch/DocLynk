apiVersion: v1
kind: Namespace
metadata:
  name: testnet
---
apiVersion: v1
kind: Service
metadata:
  name: bootnode
  namespace: testnet
spec:
  selector:
    app: bootnode
  ports:
    - name: p2p
      port: 9000
      targetPort: 9000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bootnode
  namespace: testnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bootnode
  template:
    metadata:
      labels:
        app: bootnode
    spec:
      containers:
        - name: bootnode
          image: p2p-node:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/bootnode", "--self", "$(POD_IP)"]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node
  namespace: testnet
spec:
  replicas: 63
  selector:
    matchLabels:
      app: node
  template:
    metadata:
      labels:
        app: node
    spec:
      containers:
        - name: node
          image: p2p-node:latest
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/node
            - --self
            - $(POD_IP)
            - --boot
            - $(BOOTNODE_SERVICE_HOST)
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
